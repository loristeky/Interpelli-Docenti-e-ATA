name: Build programma Windows

# Crea la versione per Windows (cartella con Interpelli Scuola.exe, in uno zip).
# Si avvia a mano: Azioni -> "Build programma Windows" -> Run workflow.
# Quando finisce, scarica lo zip dalla sezione "Artifacts" in fondo alla pagina dell'esecuzione.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # Su Windows la console usa cp1252 e Flet va in errore scrivendo simboli come «√»
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet==1.0.4

      - name: Build Windows
        shell: bash
        run: |
          for i in 1 2 3; do
            flet build windows --yes --no-rich-output --verbose && exit 0
            [ "$i" -eq 3 ] && exit 1
            echo "::warning::Tentativo $i non riuscito: riprovo tra 60 secondi"
            sleep 60
          done

      - name: Comprimi la cartella
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/* -DestinationPath Interpelli-Scuola-Windows.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: interpelli-scuola-windows
          path: Interpelli-Scuola-Windows.zip
