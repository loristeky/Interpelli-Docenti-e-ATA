name: Build APK (prova)

# APK per provare l'app sul telefono. Per Google Play usa "Build AAB per Google Play".
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet==1.0.4

      - name: Accetta le licenze Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build APK
        # I server di Gradle/Maven a volte rispondono «429 Too Many Requests»: si riprova fino a 3 volte.
        run: |
          for i in 1 2 3; do
            flet build apk --yes --no-rich-output --verbose && exit 0
            [ "$i" -eq 3 ] && exit 1
            echo "::warning::Tentativo $i non riuscito (probabile limite di richieste dei server): riprovo tra 90 secondi"
            sleep 90
          done

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: interpelli-scuola-apk
          path: build/apk/*.apk
