name: Build Flet APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.0'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.23.2

      - name: Build APK with Internet Permissions
        run: |
          flet build apk --description "Interpelli e supplenze della scuola in tutta Italia" --android-permissions android.permission.INTERNET=true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: interpelli-scuola-apk
          path: build/apk/*.apk
