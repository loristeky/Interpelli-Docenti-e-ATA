name: Build and Sign Flet AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.0'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.23.2

      - name: Prepare Flet template (app name "Interpelli Scuola")
        run: |
          TPL="$RUNNER_TEMP/flet-template"
          git clone --depth 1 --branch 0.23.2 https://github.com/flet-dev/flet-build-template.git "$TPL"
          rm -rf "$TPL/.git"
          MANIFEST="$TPL/{{cookiecutter.out_dir}}/android/app/src/main/AndroidManifest.xml"
          sed -i 's|android:label="{{ cookiecutter.product_name }}"|android:label="Interpelli Scuola"|' "$MANIFEST"
          grep -q 'android:label="Interpelli Scuola"' "$MANIFEST"

      - name: Force minSdk to 24 in build.gradle
        run: |
          BUILD_GRADLE="$RUNNER_TEMP/flet-template/{{cookiecutter.out_dir}}/android/app/build.gradle"
          # Sostituisce qualsiasi riferimento a minSdkVersion con il valore fisso 24
          sed -i 's/minSdkVersion.*/minSdkVersion 24/g' "$BUILD_GRADLE"
          sed -i 's/minSdk = .*/minSdk = 24/g' "$BUILD_GRADLE"

      - name: Generate Release Keystore Inside App Folder
        run: |
          APP_ANDROID_DIR="$RUNNER_TEMP/flet-template/{{cookiecutter.out_dir}}/android/app"
          keytool -genkey -v -keystore "$APP_ANDROID_DIR/release.jks" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias "interpelli-alias" \
            -storepass "interpelli123" \
            -keypass "interpelli123" \
            -dname "CN=Interpelli Scuola, OU=Development, O=Interpelli, L=Italy, C=IT"

      - name: Configure Android Signing in Template
        run: |
          GRADLE_FILE="$RUNNER_TEMP/flet-template/{{cookiecutter.out_dir}}/android/app/build.gradle"
          
          cat << 'EOF' >> "$GRADLE_FILE"

          android {
              signingConfigs {
                  release {
                      storeFile file('release.jks')
                      storePassword 'interpelli123'
                      keyAlias 'interpelli-alias'
                      keyPassword 'interpelli123'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build App Bundle
        run: |
          flet build aab \
            --template "$RUNNER_TEMP/flet-template" \
            --description "Cerca tra migliaia di avvisi di supplenza in tutte le regioni italiane."

      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: interpelli-scuola-signed-aab-v2
          path: build/aab/*.aab
