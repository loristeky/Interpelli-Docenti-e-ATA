name: Build APK (prova)

# APK per provare l'app sul telefono. Per Google Play usa "Build AAB per Google Play".
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet==1.0.4

      - name: Accetta le licenze Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build APK
        run: flet build apk --yes --no-rich-output --verbose

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: interpelli-scuola-apk
          path: build/apk/*.apk
