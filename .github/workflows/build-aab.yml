name: Build AAB per Google Play

# Crea l'app bundle (.aab) firmato con la TUA chiave di caricamento, sempre la stessa.
# Si avvia a mano: Actions -> "Build AAB per Google Play" -> Run workflow.
# Configurazione e passaggi su Play Console: vedi PLAYSTORE.md

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versione mostrata agli utenti (es. 1.0.0)"
        default: "1.0.0"
        required: true

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - name: Controlla che la chiave di firma sia configurata
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KS KSP ALIAS KP; do
            if [ -z "${!v}" ]; then echo "::error::Manca il secret per $v: vedi PLAYSTORE.md"; exit 1; fi
          done

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet==1.0.4

      - name: Accetta le licenze Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Ricrea il keystore dal secret
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "FLET_ANDROID_SIGNING_KEY_STORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      # L'identificativo dell'app (bundle_id) e il nome sono in pyproject.toml.
      # Il numero di build sale a ogni esecuzione, come richiesto da Play.
      - name: Build AAB
        env:
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flet build aab --yes --no-rich-output --verbose \
            --build-version "${{ inputs.version }}" \
            --build-number "${{ github.run_number }}"

      # Mostra l'impronta del certificato: deve essere identica a ogni build.
      - name: Verifica la firma
        run: |
          AAB=$(ls build/aab/*.aab | head -n1)
          echo "File: $AAB"
          keytool -printcert -jarfile "$AAB" | grep -E "Owner|SHA256"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: interpelli-scuola-aab
          path: build/aab/*.aab
